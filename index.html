<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Pricing Analysis</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;background:#1a1a2e;color:#eee;padding:12px;min-height:100vh;overflow-x:hidden}
.header-row{display:flex;justify-content:center;align-items:center;position:relative;margin-bottom:4px}
h1{text-align:center;color:#39ff14;font-size:20px;letter-spacing:1px}
.sub{text-align:center;color:#39ff14;font-size:22px;margin-bottom:12px;letter-spacing:1px;font-weight:700}
.loading{text-align:center;padding:80px;color:#4fc3f7;font-size:18px}
.spin{display:inline-block;width:30px;height:30px;border:3px solid #333;border-top:3px solid #4fc3f7;border-radius:50%;animation:sp .8s linear infinite;margin-bottom:10px}
@keyframes sp{to{transform:rotate(360deg)}}
.section-title{color:#4fc3f7;font-size:11px;text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;padding-left:4px;font-weight:600}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:12px}
.cd{background:#0d1a30;border-radius:10px;padding:12px;text-align:center;border-left:4px solid #4fc3f7;transition:.2s;cursor:pointer}
.cd:hover{transform:translateY(-2px);box-shadow:0 4px 15px rgba(79,195,247,.3);border-left-color:#fff}
.cd.g{border-left-color:#39ff14}.cd.o{border-left-color:#e09f3e}.cd.r{border-left-color:#dc2f02}.cd.p{border-left-color:#a855f7}.cd.b{border-left-color:#4fc3f7}.cd.pk{border-left-color:#f72585}.cd.teal{border-left-color:#00bcd4}
.cd .lb{font-size:10px;color:#999;text-transform:uppercase;letter-spacing:.5px}
.cd .vl{font-size:22px;font-weight:700;color:#fff}
.cd .sub-val{font-size:28px;color:#888;margin-top:4px;font-weight:800}
.cd .change{font-size:11px;margin-top:2px}
.cd .change.up{color:#39ff14}.cd .change.down{color:#dc2f02}
.fbox{background:#0d1a30;border-radius:10px;padding:12px;margin-bottom:12px}
.frow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.frow select,.frow input{background:#0a0f1e;color:#eee;border:1px solid #444;border-radius:6px;padding:5px 8px;font-size:11px;min-width:110px}
.frow select:focus,.frow input:focus{border-color:#4fc3f7;outline:none}
.fbtn{background:#39ff14;color:#1a1a2e;border:none;border-radius:6px;padding:6px 14px;font-size:12px;font-weight:700;cursor:pointer}
.fbtn:hover{background:#2ed810}
.fbtn.clr{background:#dc2f02}.fbtn.clr:hover{background:#b02602}
.fbtn.ref{background:#e09f3e}.fbtn.ref:hover{background:#c88a2e}
.fbtn.dl{background:#4fc3f7;color:#1a1a2e}.fbtn.dl:hover{background:#3ab0e0}
.tbox{background:#0d1a30;border-radius:10px;padding:12px;margin-bottom:12px}
.tbox h3{color:#4fc3f7;font-size:12px;margin-bottom:8px;text-transform:uppercase;letter-spacing:1px;display:flex;justify-content:space-between;align-items:center}
.tbox h3 span{color:#888;font-size:11px;font-weight:400}
.twrap{overflow-x:auto;overflow-y:auto;max-height:500px;width:100%}
table{border-collapse:collapse;font-size:11px;white-space:nowrap;min-width:100%}
th{background:#0a1e40;color:#4fc3f7;padding:6px 8px;text-align:center;position:sticky;top:0;z-index:2;cursor:pointer;user-select:none}
th:hover{background:#1a4a80;color:#39ff14}
th .arrow{margin-left:4px;font-size:10px;color:#39ff14}
td{padding:5px 8px;border-bottom:1px solid #1a1a2e;color:#ddd;text-align:center}
th.sticky-col,td.sticky-col{position:sticky;left:0;z-index:3;background:#0a1e40}
td.sticky-col{background:#0d1a30}
tr:nth-child(even) td{background:#0a0f1e}
tr:hover td{background:#1f2b47}
.profit{color:#39ff14;font-weight:700}.loss{color:#dc2f02;font-weight:700}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700}
.bg{background:#143d14;color:#39ff14;border:1px solid #2a6b2a}
.br{background:#3d1414;color:#ff4444;border:1px solid #6b2a2a}
.ft{text-align:center;color:#555;font-size:10px;margin-top:8px}
.home-btn{background:none;border:none;cursor:pointer;padding:4px;position:absolute;left:0;top:50%;transform:translateY(-50%);display:flex;align-items:center}
.home-btn svg{width:28px;height:28px;fill:none;stroke:#39ff14}
/* Modal styles */
.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.9);z-index:100;overflow-y:auto;padding:20px}
.modal-overlay.show{display:block}
.modal-box{background:#111827;border:1px solid #444;border-radius:12px;max-width:1200px;margin:0 auto;padding:20px;position:relative;min-height:300px;overflow-x:auto}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid #444}
.modal-title{color:#39ff14;font-size:16px;font-weight:700}
.modal-close{background:#dc2f02;color:#fff;border:none;border-radius:6px;padding:6px 14px;font-size:13px;font-weight:700;cursor:pointer}
.modal-close:hover{background:#ff4444}
.modal-nav{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.modal-back{background:#4fc3f7;color:#1a1a2e;border:none;border-radius:6px;padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer}
.modal-back:hover{background:#39ff14}
.modal-bread{color:#999;font-size:12px}
.modal-bread span{color:#4fc3f7;font-weight:600}
.drill-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.drill-item{background:#0d1a30;border-radius:10px;padding:14px;text-align:center;border-left:4px solid #4fc3f7;cursor:pointer;transition:.2s}
.drill-item:hover{transform:translateY(-2px);box-shadow:0 4px 15px rgba(79,195,247,.3);border-left-color:#39ff14}
.drill-item .di-name{font-size:12px;color:#eee;font-weight:600;margin-bottom:4px}
.drill-item .di-count{font-size:16px;font-weight:600;color:#39ff14}
.drill-item .di-amt{font-size:20px;font-weight:700;margin-top:4px}
.drill-item.all-item{border-left-color:#e09f3e;background:#1a1a0d}
.drill-item.all-item:hover{border-left-color:#39ff14}
.drill-item.all-item .di-name{color:#e09f3e}
/* Overview card sections */
.ov-heading{color:#e09f3e;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin:10px 0 6px 4px}
.ov-card{background:#0d1a30;border-radius:10px;padding:10px 12px;border-left:4px solid #4fc3f7;transition:.2s;cursor:pointer}
.ov-card:hover{transform:translateY(-2px);box-shadow:0 4px 15px rgba(79,195,247,.3);border-left-color:#39ff14}
.ov-card.active{border-left-color:#39ff14;box-shadow:0 0 12px rgba(57,255,20,.3)}
.ov-card .ov-name{font-size:12px;font-weight:700;color:#fff;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ov-card .ov-row{display:flex;justify-content:space-between;font-size:10px;color:#aaa;margin-top:2px}
.ov-card .ov-row .ov-val{font-weight:600;color:#fff}
.ov-detail{margin-bottom:14px}
.acc-btn{background:#0d1a30;color:#e09f3e;border:1px solid #444;padding:12px 15px;width:100%;text-align:left;border-radius:6px;cursor:pointer;font-size:13px;font-weight:700;margin-top:10px;margin-bottom:5px;display:flex;justify-content:space-between;align-items:center;transition:.2s;text-transform:uppercase;}
.acc-btn:hover{background:#1a3055;border-color:#4fc3f7;}
.acc-btn.active{border-color:#4fc3f7;color:#4fc3f7;border-bottom-left-radius:0;border-bottom-right-radius:0;margin-bottom:0;background:#1a3055;}
.acc-btn span{font-size:10px;color:#888;transition:.2s;}
.acc-btn.active span{transform:rotate(180deg);color:#4fc3f7;}
.acc-content{display:none;background:#0d1a30;border:1px solid #4fc3f7;border-top:none;border-bottom-left-radius:6px;border-bottom-right-radius:6px;padding:15px;margin-bottom:10px;}
.acc-content.show{display:block;}
.chart-container{position:relative;height:250px;width:100%;margin-bottom:15px;background:#0a0f1e;border-radius:8px;padding:10px;border:1px solid #222;}
@media(max-width:768px){.cards{grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}}
</style>
</head>
<body>
<div class="header-row">
  <button class="home-btn" onclick="location.reload()" title="Refresh"><svg viewBox="0 0 24 24"><path d="M4 12L12 4l8 8" stroke="#39ff14" stroke-width="1.5"/><path d="M6 10.5V19.5a.5.5 0 00.5.5H10v-5h4v5h3.5a.5.5 0 00.5-.5V10.5" stroke="#39ff14" stroke-width="1.5"/></svg></button>
  <div class="sub">DAILY PRICING ANALYSIS</div>
</div>

<div id="loader" class="loading"><div class="spin"></div><br>Loading financial data...<br><span style="font-size:13px;color:#888">This may take 20-40 seconds for 120K+ rows</span></div>
<div id="app" style="display:none">

<!-- SUMMARY CARDS -->
<div class="section-title">FINANCIAL OVERVIEW</div>
<div class="cards" id="summaryCards"></div>

<div class="section-title" style="color:#ff6b6b">PRICING OVERVIEW</div>
<div class="cards" id="pricingCards"></div>

<!-- Drill-Down Modal (shared by all cards) -->
<div class="modal-overlay" id="modalOverlay">
<div class="modal-box">
  <div class="modal-header">
    <div class="modal-title" id="modalTitle">Drill Down</div>
    <button class="modal-close" onclick="closeModal()">X CLOSE</button>
  </div>
  <div class="modal-nav" id="modalNav" style="display:none">
    <button class="modal-back" onclick="modalGoBack()">&#9664; Back</button>
    <div class="modal-bread" id="modalBread"></div>
  </div>
  <div id="modalContent"></div>
</div>
</div>

<!-- DATE RANGE + REFRESH + DOWNLOAD -->
<div class="fbox">
<div class="frow" style="flex-wrap:wrap;gap:6px">
  <select id="fDateRange" onchange="applyDateFilter()" style="background:#0a1628;color:#39ff14;border:1px solid #39ff14;border-radius:6px;padding:6px 10px;font-size:13px;font-weight:600;cursor:pointer">
    <option value="">All Time</option>
    <option value="0">Today</option>
    <option value="1" selected>Yesterday</option>
    <option value="7">Last 7 Days</option>
    <option value="15">Last 15 Days</option>
    <option value="30">Last 30 Days</option>
    <option value="60">Last 60 Days</option>
  </select>
  <button class="fbtn ref" onclick="forceRefresh()">Refresh</button>
  <button class="fbtn dl" onclick="downloadCSV()">Download CSV</button>
</div>
</div>

<!-- OVERVIEW SECTION -->
<div class="section-title" style="color:#e09f3e;font-size:13px;margin-top:8px">OVERVIEW</div>

<button class="acc-btn" id="btn-platform" onclick="toggleAcc('platform')">PLATFORM <span id="arr-platform">▼</span></button>
<div class="acc-content" id="acc-platform">
  <div id="platformCards"></div>
  <div class="ov-detail" id="platformDetail"></div>
</div>

<button class="acc-btn" id="btn-company" onclick="toggleAcc('company')">COMPANY <span id="arr-company">▼</span></button>
<div class="acc-content" id="acc-company">
  <div id="companyCards"></div>
  <div class="ov-detail" id="companyDetail"></div>
</div>

<button class="acc-btn" id="btn-category" onclick="toggleAcc('category')">CATEGORY <span id="arr-category">▼</span></button>
<div class="acc-content" id="acc-category">
  <div id="categoryCards"></div>
  <div class="ov-detail" id="categoryDetail"></div>
</div>

<button class="acc-btn" id="btn-subCategory" onclick="toggleAcc('subCategory')">SUB CATEGORY <span id="arr-subCategory">▼</span></button>
<div class="acc-content" id="acc-subCategory">
  <div id="subCategoryCards"></div>
  <div class="ov-detail" id="subCategoryDetail"></div>
</div>

<div class="ft" id="lastUp"></div>
</div>

<script>
var API_URL='https://script.google.com/macros/s/AKfycbx1o9v2dSq8ytAZPiP26AjRAdadDSX0iZCwdqE6c0TVNwHacqAPHB7IT22wnATxPFNi/exec';

var DATA={},FILTERED_DATA={};
var DATA_CACHE={};
var _activeController=null;
var _renderTimer=null;

function fmt(n){if(n==null||isNaN(n))return '0';return Number(n).toLocaleString('en-IN',{maximumFractionDigits:0});}
function fmtCur(n){return fmt(n);}
function fmtPct(n){return (n||0).toFixed(1)+'%';}

// ===== EXPAND SHORT KEYS =====
var _SKM={u:'unique',oi:'orderId',ti:'trackingId',ci:'companyId',si:'skuId',so:'subOrderId',q:'qty',cr:'courier',sk:'sku',sc:'singleCombo',ca:'category',sb:'subCategory',co:'color',pr:'product',rq:'required',gr:'gross',tp:'taxPct',ta:'taxAmt',n:'net',cp:'cop',p:'pl',ap:'actualPrice',sp:'sellingPrice',ep:'estSellingPrice',d:'diff',dt:'date',pf:'platform',cm:'company'};
var _DDM={dt:'date',pf:'platform',cm:'company',o:'orders',q:'qty',g:'gross',n:'net',t:'tax',c:'cop',p:'pl'};
function _expandRow(r){if(r.unique!==undefined)return r;var o={};for(var k in r){o[_SKM[k]||k]=r[k];}return o;}
function _expandPricing(pr){if(!pr)return;for(var pt in pr){if(!pr[pt].byPlatform)continue;for(var pp in pr[pt].byPlatform){for(var pc in pr[pt].byPlatform[pp].byCompany){var c=pr[pt].byPlatform[pp].byCompany[pc];if(c.rows&&c.rows.length>0&&c.rows[0].unique===undefined){for(var i=0;i<c.rows.length;i++){c.rows[i]=_expandRow(c.rows[i]);}}}}}}
function _expandDaily(arr){if(!arr||!arr.length)return arr;if(arr[0].date!==undefined)return arr;for(var i=0;i<arr.length;i++){var e=arr[i];if(e.d!==undefined&&e.date===undefined){e.date=e.d;e.orders=e.o||0;e.qty=e.q||0;e.gross=e.g||0;e.net=e.n||0;e.tax=e.t||0;e.cop=e.c||0;e.pl=e.p||0;}}return arr;}

// ===== LOAD DATA =====
var _refreshing=false;
function loadData(){
  var defaultDays=document.getElementById('fDateRange')?document.getElementById('fDateRange').value:'1';
  var fetchUrl=defaultDays?API_URL+'?days='+defaultDays:API_URL;
  var cacheKey=defaultDays?'_bg_'+defaultDays:'all';
  if(DATA_CACHE[cacheKey]){onDataDirect(DATA_CACHE[cacheKey],cacheKey);startAutoRefresh();return;}
  document.getElementById('loader').style.display='block';
  document.getElementById('app').style.display='none';
  var controller=new AbortController();
  var tid=setTimeout(function(){controller.abort();},180000);
  fetch(fetchUrl,{redirect:'follow',signal:controller.signal})
    .then(function(r){clearTimeout(tid);if(!r.ok)throw new Error('HTTP '+r.status);return r.text();})
    .then(function(text){
      if(!text||text.trim().length===0){onErr('Empty response.');return;}
      if(text.trim().charAt(0)==='<'){onErr('API returned HTML. Deploy with access: Anyone');return;}
      try{
        var d=JSON.parse(text);
        DATA_CACHE[cacheKey]=d;
        onDataDirect(d,cacheKey);
        startAutoRefresh();
      }catch(e){onErr('JSON parse error: '+e.message);}
    })
    .catch(function(e){clearTimeout(tid);onErr((e.name==='AbortError'?'Timeout (180s).':'Fetch failed: '+e.message));});
}

// ===== AUTO-REFRESH (every 1 min, soft) =====
var _autoRefreshTimer=null;
function startAutoRefresh(){
  if(_autoRefreshTimer)return;
  _autoRefreshTimer=setInterval(silentRefresh,60000);
}
function silentRefresh(){
  if(_refreshing)return;
  var modal=document.getElementById('modalOverlay');
  if(modal&&modal.classList.contains('show'))return;
  _refreshing=true;
  var daysVal=_currentDays;
  var refreshUrl=daysVal?API_URL+'?days='+daysVal:API_URL;
  if(_activeController){try{_activeController.abort();}catch(e){}}
  var controller=new AbortController();
  _activeController=controller;
  var tid=setTimeout(function(){try{controller.abort();}catch(e){}_refreshing=false;},60000);
  fetch(refreshUrl,{redirect:'follow',signal:controller.signal})
    .then(function(r){clearTimeout(tid);if(!r.ok)throw new Error('HTTP '+r.status);return r.text();})
    .then(function(text){
      _refreshing=false;
      if(!text||text.trim().length===0)return;
      if(text.trim().charAt(0)==='<')return;
      try{
        var d=JSON.parse(text);
        if(d.error)return;
        _expandPricing(d.pricing);
        _expandDaily(d.daily);
        var cacheKey=daysVal?'_bg_'+daysVal:'all';
        DATA_CACHE[cacheKey]=d;
        if(!daysVal)DATA_CACHE['all']=d;
        DATA=d;FILTERED_DATA=d;renderAllDebounced();
        document.getElementById('lastUp').textContent='Auto-updated: '+new Date().toLocaleString()+' | Data: '+(d.timestamp||'');
      }catch(e){}
    })
    .catch(function(e){clearTimeout(tid);_refreshing=false;});
}

// Force refresh
function forceRefresh(){
  if(_refreshing)return;
  _refreshing=true;
  var btn=document.querySelector('.fbtn.ref');
  if(btn){btn.textContent='Refreshing...';btn.style.opacity='0.6';}
  function resetBtn(){_refreshing=false;if(btn){btn.textContent='Refresh';btn.style.opacity='1';}}
  var daysVal=_currentDays;
  var fetchUrl=daysVal?API_URL+'?days='+daysVal+'&nocache=1':API_URL+'?nocache=1';
  var cacheKey=daysVal?'_bg_'+daysVal:'all';
  delete DATA_CACHE[cacheKey];
  if(_activeController){try{_activeController.abort();}catch(e){}}
  var controller=new AbortController();
  _activeController=controller;
  var tid=setTimeout(function(){try{controller.abort();}catch(e){}resetBtn();},60000);
  fetch(fetchUrl,{redirect:'follow',signal:controller.signal})
    .then(function(r){clearTimeout(tid);if(!r.ok)throw new Error('HTTP '+r.status);return r.text();})
    .then(function(text){
      resetBtn();
      if(!text||text.trim().length===0)return;
      if(text.trim().charAt(0)==='<')return;
      try{
        var d=JSON.parse(text);
        if(d.error)return;
        _expandPricing(d.pricing);
        _expandDaily(d.daily);
        DATA_CACHE[cacheKey]=d;
        DATA=d;FILTERED_DATA=d;renderAllDebounced();
        document.getElementById('lastUp').textContent='Updated: '+new Date().toLocaleString()+' | Data: '+(d.timestamp||'');
      }catch(e){}
    })
    .catch(function(e){clearTimeout(tid);resetBtn();});
}

function onErr(msg){document.getElementById('loader').innerHTML='<div style="color:#dc2f02;font-size:14px">'+msg+'</div><br><a href="'+API_URL+'" target="_blank" style="color:#4fc3f7">Test API directly</a>';}

function onDataDirect(d,cacheKey){
  if(d.error){onErr(d.error);return;}
  _expandPricing(d.pricing);
  _expandDaily(d.daily);
  DATA=d;FILTERED_DATA=d;
  var daysVal=document.getElementById('fDateRange')?document.getElementById('fDateRange').value:'';
  _currentDays=daysVal;
  document.getElementById('loader').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('lastUp').textContent='Updated: '+new Date().toLocaleString()+' | Data: '+(d.timestamp||'');
  renderAll();
}

// ===== DATE FILTER =====
var _currentDays='';
function applyDateFilter(){
  var daysVal=document.getElementById('fDateRange')?document.getElementById('fDateRange').value:'';
  _currentDays=daysVal;
  if(_activeController){try{_activeController.abort();}catch(e){}}

  var refBtn=document.querySelector('.fbtn.ref');
  if(refBtn){refBtn.textContent='Loading...';refBtn.style.opacity='0.6';}
  function rstUI(){if(refBtn){refBtn.textContent='Refresh';refBtn.style.opacity='1';}}

  if(daysVal===''){
    var src=DATA_CACHE['all'];
    if(src){_expandPricing(src.pricing);_expandDaily(src.daily);DATA=src;FILTERED_DATA=src;renderAll();rstUI();return;}
    var ctrl=new AbortController();_activeController=ctrl;
    var tid=setTimeout(function(){try{ctrl.abort();}catch(e){}rstUI();}, 30000);
    fetch(API_URL,{redirect:'follow',signal:ctrl.signal}).then(function(r){return r.ok?r.text():null;}).then(function(text){
      clearTimeout(tid); rstUI();
      if(!text||_currentDays!=='')return;try{var d=JSON.parse(text);_expandPricing(d.pricing);_expandDaily(d.daily);DATA_CACHE['all']=d;DATA=d;FILTERED_DATA=d;renderAll();}catch(e){}
    }).catch(function(){clearTimeout(tid); rstUI();});
    return;
  }
  var bgKey='_bg_'+daysVal;
  if(DATA_CACHE[bgKey]){
    var bd=DATA_CACHE[bgKey];_expandPricing(bd.pricing);_expandDaily(bd.daily);
    DATA=bd;FILTERED_DATA=bd;renderAll();rstUI();return;
  }
  // Client-side preview
  var src=DATA_CACHE['all'];
  if(src){
    var days=parseInt(daysVal,10);var now=new Date();var startStr='',endStr='';
    if(days===0){startStr=now.toISOString().slice(0,10);endStr=startStr;}
    else if(days===1){var yd=new Date(now);yd.setDate(yd.getDate()-1);startStr=yd.toISOString().slice(0,10);endStr=startStr;}
    else{var cd=new Date(now);cd.setDate(cd.getDate()-days);startStr=cd.toISOString().slice(0,10);endStr=now.toISOString().slice(0,10);}
    var allDaily=src.daily||[];var filtDaily=[];
    for(var i=0;i<allDaily.length;i++){var dt=(allDaily[i].date||allDaily[i].d||'');if(dt>=startStr&&dt<=endStr)filtDaily.push(allDaily[i]);}
    var sm={totalOrders:0,totalQty:0,grossReceived:0,netReceived:0,taxAmount:0,cop:0,pl:0,avgOrderValue:0,margin:0};
    for(var i=0;i<filtDaily.length;i++){var dd=filtDaily[i];sm.totalOrders+=(dd.orders||dd.o||0);sm.totalQty+=(dd.qty||dd.q||0);sm.grossReceived+=(dd.gross||dd.g||0);sm.netReceived+=(dd.net||dd.n||0);sm.taxAmount+=(dd.tax||dd.t||0);sm.cop+=(dd.cop||dd.c||0);sm.pl+=(dd.pl||dd.p||0);}
    sm.avgOrderValue=sm.totalOrders>0?sm.grossReceived/sm.totalOrders:0;
    sm.margin=sm.grossReceived>0?(sm.pl/sm.grossReceived*100):0;
    var monthMap={};

    var fp={short:{count:0,totalDiff:0,byPlatform:{}},excess:{count:0,totalDiff:0,byPlatform:{}},equal:{count:0,totalDiff:0,byPlatform:{}}};
    for(var i=0;i<filtDaily.length;i++){var dd=filtDaily[i];fp.short.count+=(dd.sc||0);fp.short.totalDiff+=(dd.sd||0);fp.excess.count+=(dd.ec||0);fp.excess.totalDiff+=(dd.ed||0);fp.equal.count+=(dd.qc||0);}
    var fd={summary:sm,daily:filtDaily,byMonth:filtMonths,pricing:fp,byPlatform:src.byPlatform,byCompany:src.byCompany,byCategory:src.byCategory,bySubCategory:src.bySubCategory,topSkus:src.topSkus,platforms:src.platforms,companies:src.companies,timestamp:src.timestamp};
    DATA=fd;FILTERED_DATA=fd;renderAll();
  }
  // Fetch accurate server data
  var ctrl2=new AbortController();_activeController=ctrl2;
  var tid2=setTimeout(function(){try{ctrl2.abort();}catch(e){}rstUI();}, 60000);
  fetch(API_URL+'?days='+daysVal+'&nocache='+new Date().getTime(),{redirect:'follow',signal:ctrl2.signal}).then(function(r){return r.ok?r.text():null;}).then(function(text){
    clearTimeout(tid2); rstUI();
    if(!text||_currentDays!==daysVal)return;
    try{
      var d=JSON.parse(text);

}

function _renderTableCard(section, dataObj, keys) {
  if(!keys.length) return '<div style="color:#888;padding:10px;font-size:12px">No data available</div>';
  var h = '<div class="tbox" style="margin-bottom:8px"><div class="twrap"><table style="width:100%"><thead><tr><th style="text-align:left;width:30%">NAME</th><th>ORDERS</th><th>REVENUE</th><th>PROFIT</th><th>MARGIN</th></tr></thead><tbody>';
  var totOrd=0,totGross=0,totPl=0;
  for(var i=0;i<keys.length;i++){
    var k = keys[i];
    var p = dataObj[k];
    var margin = p.gross > 0 ? (p.pl / p.gross * 100) : 0;
    var plClass = p.pl >= 0 ? 'profit' : 'loss';
    var plSign = p.pl >= 0 ? '+' : '';
    var mClass = margin >= 0 ? 'profit' : 'loss';
    var color = OV_COLORS[i%OV_COLORS.length];
    var isActive = _activeOvCard[section] === k;
    var rowBg = isActive ? 'background:#1a3055' : '';
    totOrd+=(p.orders||0);totGross+=(p.gross||0);totPl+=(p.pl||0);
    h += '<tr style="cursor:pointer;'+rowBg+'" onclick="toggleOvDetail(\''+section+'\',\''+k.replace(/'/g,"\\'")+'\')">'
       + '<td style="text-align:left;border-left:4px solid '+color+';font-weight:700;color:#fff;white-space:normal;word-break:break-word">' + k + '</td>'
       + '<td>' + fmt(p.orders) + '</td>'
       + '<td>' + fmtCur(p.gross) + '</td>'
       + '<td class="'+plClass+'">' + plSign + fmtCur(p.pl) + '</td>'
       + '<td class="'+mClass+'">' + fmtPct(margin) + '</td>'
       + '</tr>';
  }
  // Totals row
  var totMargin=totGross>0?(totPl/totGross*100):0;
  var tPlClass=totPl>=0?'profit':'loss';
  var tPlSign=totPl>=0?'+':'';
  var tMClass=totMargin>=0?'profit':'loss';
  h += '<tr style="background:#0a1e40;font-weight:700;border-top:2px solid #4fc3f7">'
     + '<td style="text-align:left;color:#4fc3f7;font-weight:700">TOTAL</td>'
     + '<td style="color:#fff;font-weight:700">'+fmt(totOrd)+'</td>'
     + '<td style="color:#fff;font-weight:700">'+fmtCur(totGross)+'</td>'
     + '<td class="'+tPlClass+'" style="font-weight:700">'+tPlSign+fmtCur(totPl)+'</td>'
     + '<td class="'+tMClass+'" style="font-weight:700">'+fmtPct(totMargin)+'</td>'
     + '</tr>';
  h += '</tbody></table></div></div>';
  return h;
}

function renderDrillPlatforms(){
  var bp=FILTERED_DATA.byPlatform||{};
  var isPricing=(DM.type==='short'||DM.type==='excess'||DM.type==='equal');
  var h='<div class="drill-grid">';
  if(isPricing){
    var p=DM.data;
    var pColor=DM.type==='short'?'#dc2f02':(DM.type==='excess'?'#39ff14':'#e09f3e');
    var pSign=DM.type==='short'?'-':(DM.type==='excess'?'+':'');
    h+='<div class="drill-item all-item" onclick="drillToPlatform(\'\')"><div class="di-name">ALL</div><div class="di-count" style="color:'+pColor+'">'+fmt(p.count)+'</div><div class="di-amt" style="color:'+pColor+'">'+pSign+fmtCur(Math.abs(p.totalDiff))+'</div></div>';
    var plats=Object.keys(p.byPlatform).sort(function(a,b){return p.byPlatform[b].count-p.byPlatform[a].count;});
    for(var i=0;i<plats.length;i++){
      var pp=p.byPlatform[plats[i]];
      h+='<div class="drill-item" style="border-left-color:'+DM_COLORS[i%DM_COLORS.length]+'" onclick="drillToPlatform(\''+plats[i].replace(/'/g,"\\'")+'\')">';
      h+='<div class="di-name">'+plats[i]+'</div><div class="di-count" style="color:'+pColor+'">'+fmt(pp.count)+'</div><div class="di-amt" style="color:'+pColor+'">'+pSign+fmtCur(Math.abs(pp.diff))+'</div></div>';
    }
  } else {
    var totalVal=0;for(var k in bp)totalVal+=getMetricVal(bp[k],DM.type);
    h+='<div class="drill-item all-item" onclick="drillToPlatform(\'\')"><div class="di-name">ALL</div><div class="di-count">'+fmtMetric(totalVal,DM.type)+'</div></div>';
    var sorted=Object.keys(bp).sort(function(a,b){return getMetricVal(bp[b],DM.type)-getMetricVal(bp[a],DM.type);});

      var val=getMetricVal(bp[sorted[i]],DM.type);

    }

function drillToPlatform(plat){
  DM.level=2;DM.platform=plat||'ALL';
  var isPricing=(DM.type==='short'||DM.type==='excess'||DM.type==='equal');
  // Skip logic removed to allow Company drill-down

}

function renderDrillCompanies(){
  var isPricing=(DM.type==='short'||DM.type==='excess'||DM.type==='equal');
  var h='<div class="drill-grid">';
  if(isPricing){
    var p=DM.data;
    var pColor=DM.type==='short'?'#dc2f02':(DM.type==='excess'?'#39ff14':'#e09f3e');
    var pSign=DM.type==='short'?'-':(DM.type==='excess'?'+':'');
    var companies={};
    if(DM.platform==='ALL'){
      for(var pp in p.byPlatform){for(var cc in p.byPlatform[pp].byCompany){if(!companies[cc])companies[cc]={count:0,diff:0};companies[cc].count+=p.byPlatform[pp].byCompany[cc].count;companies[cc].diff+=p.byPlatform[pp].byCompany[cc].diff;}}
    } else {
      companies=p.byPlatform[DM.platform]?p.byPlatform[DM.platform].byCompany:{};
    }
    var totalCount=0,totalDiff=0;for(var cc in companies){totalCount+=companies[cc].count;totalDiff+=companies[cc].diff;}
    h+='<div class="drill-item all-item" onclick="drillToCompany(\'\')"><div class="di-name">ALL</div><div class="di-count" style="color:'+pColor+'">'+fmt(totalCount)+'</div><div class="di-amt" style="color:'+pColor+'">'+pSign+fmtCur(Math.abs(totalDiff))+'</div></div>';
    var comps=Object.keys(companies).sort(function(a,b){return companies[b].count-companies[a].count;});
    for(var i=0;i<comps.length;i++){
      var co=companies[comps[i]];
      h+='<div class="drill-item" style="border-left-color:'+DM_COLORS[i%DM_COLORS.length]+'" onclick="drillToCompany(\''+comps[i].replace(/'/g,"\\'")+'\')">';
      h+='<div class="di-name">'+comps[i]+'</div><div class="di-count" style="color:'+pColor+'">'+fmt(co.count)+'</div><div class="di-amt" style="color:'+pColor+'">'+pSign+fmtCur(Math.abs(co.diff))+'</div></div>';
    }
    DM.companies=companies;
  } else {
    var compMap={};
    if(DM.platform==='ALL'){
      var bc=FILTERED_DATA.byCompany||{};
      for(var k in bc)compMap[k]=getMetricVal(bc[k],DM.type);
    }else{
      var bp=FILTERED_DATA.byPlatform||{};
      var bc=(bp[DM.platform]&&bp[DM.platform].byCompany)?bp[DM.platform].byCompany:{};
      for(var k in bc)compMap[k]=getMetricVal(bc[k],DM.type);
    }
    var totalVal=0;for(var k in compMap)totalVal+=compMap[k];
    h+='<div class="drill-item all-item" onclick="drillToCompany(\'\')"><div class="di-name">ALL</div><div class="di-count">'+fmtMetric(totalVal,DM.type)+'</div></div>';
    var sorted=Object.keys(compMap).sort(function(a,b){return compMap[b]-compMap[a];});
    for(var i=0;i<sorted.length;i++){
      h+='<div class="drill-item" style="border-left-color:'+DM_COLORS[i%DM_COLORS.length]+'" onclick="drillToCompany(\''+sorted[i].replace(/'/g,"\\'")+'\')">';
      h+='<div class="di-name">'+sorted[i]+'</div><div class="di-count">'+fmtMetric(compMap[sorted[i]],DM.type)+'</div></div>';
    }
    DM.companies=compMap;
  }
  h+='</div>';
  document.getElementById('modalContent').innerHTML=h;
}

function drillToCompany(comp){
  DM.level=3;DM.company=comp||'ALL';
  document.getElementById('modalTitle').textContent=DM.label+' - Details';
  document.getElementById('modalNav').style.display='flex';
  document.getElementById('modalNav').innerHTML='<button class="modal-back" onclick="modalGoBack()">&#9664; Back</button><div class="modal-bread" id="modalBread"><span>'+DM.label+'</span> &rarr; <span>'+DM.platform+'</span> &rarr; <span>'+DM.company+'</span></div>';
  renderDrillTable();
}

function renderDrillTable(){
  var isPricing=(DM.type==='short'||DM.type==='excess'||DM.type==='equal');
  document.getElementById('modalContent').innerHTML='<div style="text-align:center;padding:40px;color:#4fc3f7">Loading rows...<br><small>Fetching data from server</small></div>';
  var rowType=isPricing?DM.type:'all';
  var rowUrl=API_URL+'?mode=rows&type='+encodeURIComponent(rowType)+'&platform='+encodeURIComponent(DM.platform==='ALL'?'':DM.platform||'')+'&company='+encodeURIComponent(DM.company==='ALL'?'':DM.company)+(_currentDays?'&days='+_currentDays:'');
  fetch(rowUrl,{redirect:'follow'}).then(function(r){return r.text();}).then(function(text){
    try{var d=JSON.parse(text);var rawRows=d.rows||[];var rows=[];for(var ri=0;ri<rawRows.length;ri++){rows.push(_expandRow(rawRows[ri]));}rows.sort(function(a,b){return Math.abs(b.diff)-Math.abs(a.diff);});_renderDrillRows(rows);}catch(e){document.getElementById('modalContent').innerHTML='<div style="color:red;padding:20px">Error loading rows: '+e.message+'</div>';}
  }).catch(function(e){document.getElementById('modalContent').innerHTML='<div style="color:red;padding:20px">Fetch failed: '+e.message+'</div>';});
}

function _renderDrillRows(rows){
  var groups={};
  for(var i=0;i<rows.length;i++){
    var r=rows[i],gk=(r.skuId||r.sku)+'|'+(r.platform||'')+'|'+(r.company||'');
    if(!groups[gk]){groups[gk]={skuId:r.skuId||r.sku,platform:r.platform||'',company:r.company||'',sku:r.sku,category:r.category,subCategory:r.subCategory||'',singleCombo:r.singleCombo||'',color:r.color||'',product:r.product||'',courier:r.courier||'',count:0,qty:0,required:0,gross:0,diff:0,taxAmt:0,net:0,cop:0,pl:0,actualPrice:0,sellingPrice:0,estSellingPrice:0,rows:[]};}
    groups[gk].count++;groups[gk].qty+=r.qty;groups[gk].required+=r.required;groups[gk].gross+=r.gross;groups[gk].diff+=r.diff;groups[gk].taxAmt+=(r.taxAmt||0);groups[gk].net+=(r.net||0);groups[gk].cop+=(r.cop||0);groups[gk].pl+=(r.pl||0);groups[gk].actualPrice+=(r.actualPrice||0);groups[gk].sellingPrice+=(r.sellingPrice||0);groups[gk].estSellingPrice+=(r.estSellingPrice||0);groups[gk].rows.push(r);
  }
  var gArr=Object.values(groups).sort(function(a,b){return b.count-a.count;});
  var h='<div style="margin-bottom:8px;display:flex;gap:8px;align-items:center"><input class="srch" id="drillSearch" onkeyup="drillFilterTable()" placeholder="Search SKUs..." style="background:#0a1628;color:#fff;border:1px solid #4fc3f7;border-radius:6px;padding:6px 10px;width:200px"><button onclick="drillDownloadCSV()" class="fbtn dl">Download CSV</button><button onclick="showAllPricingRows()" class="fbtn" style="background:#a855f7;color:#fff">ALL</button><span style="color:#aaa;margin-left:auto;font-size:12px">'+gArr.length+' UNIQUE SKUs FROM '+rows.length+' ROWS</span></div>';
  h+='<div class="tbox" style="margin:0"><h3>SKU SUMMARY<span>'+gArr.length+' SKUs</span></h3><div class="twrap"><table id="drillTable"><thead><tr>';
  h+='<th class="sticky-col">COUNT</th><th>SKU ID</th><th>PLATFORM</th><th>COMPANY</th><th>MASTER SKU</th><th>CATEGORY</th><th>SUB CAT</th><th>PRODUCT</th><th>COLOR</th><th>QTY</th><th>REQUIRED</th><th>GROSS</th><th>DIFF</th><th>TAX AMT</th><th>NET</th><th>COP</th><th>P/L</th><th>ACTUAL PRICE</th><th>SELLING PRICE</th><th>EST PRICE</th>';
  h+='</tr></thead><tbody>';
  for(var i=0;i<gArr.length;i++){
    var g=gArr[i],dc=g.diff<0?'loss':'profit';
    h+='<tr>';
    h+='<td class="sticky-col" style="color:#4fc3f7;font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:3px" onmouseover="this.style.background=\'#1e3a5f\'" onmouseout="this.style.background=\'#0d1a30\'" onclick="expandSkuGroup('+i+')">'+g.count+'</td><td>'+g.skuId+'</td><td>'+g.platform+'</td><td>'+g.company+'</td><td>'+g.sku+'</td><td>'+g.category+'</td><td>'+g.subCategory+'</td><td>'+g.product+'</td><td>'+g.color+'</td><td>'+g.qty+'</td><td>'+fmt(g.required)+'</td><td>'+fmt(g.gross)+'</td><td class="'+dc+'">'+fmt(g.diff)+'</td><td>'+fmt(g.taxAmt)+'</td><td>'+fmt(g.net)+'</td><td>'+fmt(g.cop)+'</td><td class="'+(g.pl>=0?'profit':'loss')+'">'+fmt(g.pl)+'</td><td>'+fmt(g.actualPrice)+'</td><td>'+fmt(g.sellingPrice)+'</td><td>'+fmt(g.estSellingPrice)+'</td>';
    h+='</tr>';
  }
  h+='</tbody></table></div></div>';
  document.getElementById('modalContent').innerHTML=h;
  window._skuGroups=gArr;
  window._allPricingRows=rows;
}

function expandSkuGroup(idx){
  var g=window._skuGroups[idx];
  if(!g)return;
  DM.level=4;
  document.getElementById('modalTitle').textContent=DM.label+' - SKU: '+g.skuId;
  document.getElementById('modalNav').style.display='flex';
  document.getElementById('modalNav').innerHTML='<button class="modal-back" onclick="modalGoBack()">&#9664; Back</button><div class="modal-bread"><span>'+DM.label+'</span> &rarr; <span>'+(DM.platform||'ALL')+'</span> &rarr; <span>'+(DM.company||'ALL')+'</span> &rarr; <span>'+g.skuId+'</span></div>';
  showPricingRows(g.rows);
}

function showAllPricingRows(){
  var rows=window._allPricingRows;
  if(!rows)return;
  DM.level=4;
  document.getElementById('modalTitle').textContent=DM.label+' - All Rows';
  document.getElementById('modalNav').style.display='flex';
  document.getElementById('modalNav').innerHTML='<button class="modal-back" onclick="modalGoBack()">&#9664; Back</button><div class="modal-bread"><span>'+DM.label+'</span> &rarr; <span>'+(DM.platform||'ALL')+'</span> &rarr; <span>'+(DM.company||'ALL')+'</span> &rarr; <span>ALL ROWS</span></div>';
  showPricingRows(rows);
}

function showPricingRows(rows){
  var h='<div style="margin-bottom:8px;display:flex;gap:8px;align-items:center"><input class="srch" id="drillSearch" onkeyup="drillFilterTable()" placeholder="Search..." style="background:#0a1628;color:#fff;border:1px solid #4fc3f7;border-radius:6px;padding:6px 10px;width:200px"><button onclick="drillDownloadCSV()" class="fbtn dl">Download CSV</button><span style="color:#aaa;margin-left:auto;font-size:12px">SHOWING '+rows.length+' ROWS</span></div>';
  h+='<div class="tbox" style="margin:0"><h3>ALL DETAILS<span>'+rows.length+' rows</span></h3><div class="twrap"><table id="drillTable"><thead><tr>';
  h+='<th>UNIQUE</th><th>ORDER ID</th><th>TRACKING ID</th><th>COMPANY ID</th><th>SKU ID</th><th>SUB ORDER ID</th><th>DATE</th><th>PLATFORM</th><th>COMPANY</th><th>QTY</th><th>COURIER</th><th>MASTER SKU</th><th>SINGLE/COMBO</th><th>CATEGORY</th><th>SUB CAT</th><th>COLOR</th><th>PRODUCT</th><th>REQUIRED</th><th>GROSS</th><th>TAX %</th><th>TAX AMT</th><th>NET</th><th>COP</th><th>P/L</th><th>ACTUAL PRICE</th><th>SELLING PRICE</th><th>EST PRICE</th><th>DIFF</th>';
  h+='</tr></thead><tbody>';
  for(var i=0;i<rows.length;i++){
    var r=rows[i],dc=r.diff<0?'loss':'profit';
    h+='<tr><td style="text-align:left;max-width:200px;overflow:hidden;text-overflow:ellipsis">'+r.unique+'</td><td>'+(r.orderId||'')+'</td><td>'+(r.trackingId||'')+'</td><td>'+(r.companyId||'')+'</td><td>'+(r.skuId||'')+'</td><td>'+(r.subOrderId||'')+'</td><td>'+r.date+'</td><td>'+(r.platform||'')+'</td><td>'+(r.company||'')+'</td><td>'+r.qty+'</td><td>'+(r.courier||'')+'</td><td>'+r.sku+'</td><td>'+(r.singleCombo||'')+'</td><td>'+r.category+'</td><td>'+(r.subCategory||'')+'</td><td>'+(r.color||'')+'</td><td>'+(r.product||'')+'</td><td>'+fmt(r.required)+'</td><td>'+fmt(r.gross)+'</td><td>'+(r.taxPct||0)+'%</td><td>'+fmt(r.taxAmt||0)+'</td><td>'+fmt(r.net||0)+'</td><td>'+fmt(r.cop||0)+'</td><td class="'+(r.pl>=0?'profit':'loss')+'">'+fmt(r.pl||0)+'</td><td>'+fmt(r.actualPrice||0)+'</td><td>'+fmt(r.sellingPrice||0)+'</td><td>'+fmt(r.estSellingPrice||0)+'</td><td class="'+dc+'">'+fmt(r.diff)+'</td></tr>';
  }
  h+='</tbody></table></div></div>';
  document.getElementById('modalContent').innerHTML=h;
}

function drillFilterTable(){
  var q=document.getElementById('drillSearch').value.toLowerCase();
  var rows=document.querySelectorAll('#drillTable tbody tr');
  for(var i=0;i<rows.length;i++){rows[i].style.display=rows[i].textContent.toLowerCase().indexOf(q)>=0?'':'none';}
}

function drillDownloadCSV(){
  var table=document.getElementById('drillTable');
  if(!table)return;
  var ths=table.querySelectorAll('thead th');
  var headers=[];for(var i=0;i<ths.length;i++)headers.push('"'+ths[i].textContent.replace(/"/g,'""')+'"');
  var csv=headers.join(',')+'\n';
  var rows=table.querySelectorAll('tbody tr:not([style*="display: none"])');
  for(var i=0;i<rows.length;i++){var cells=rows[i].querySelectorAll('td');var r=[];for(var j=0;j<cells.length;j++)r.push('"'+cells[j].textContent.replace(/"/g,'""')+'"');csv+=r.join(',')+'\n';}
  var blob=new Blob([csv],{type:'text/csv'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='pricing_'+DM.type+'_'+new Date().toISOString().split('T')[0]+'.csv';a.click();
}

function getMetricVal(obj,type){
  if(!obj)return 0;
  switch(type){
    case 'orders':return obj.orders||0;
    case 'qty':return obj.qty||0;
    case 'gross':return obj.gross||0;
    case 'net':return obj.net||0;
    case 'tax':return obj.tax||0;
    case 'cop':return obj.cop||0;
    case 'pl':return obj.pl||0;
    default:return 0;
  }
}
function fmtMetric(val,type){
  if(type==='orders'||type==='qty')return fmt(val);
  return fmtCur(val);
}

function openPricingModal(type){var labels={short:'SHORT',excess:'EXCESS',equal:'EQUAL'};openModal(type,labels[type]||type.toUpperCase());}
function closePricingModal(){closeModal();}

// ===== ACCORDION TOGGLE =====
function toggleAcc(section){
  var btn=document.getElementById('btn-'+section);
  var content=document.getElementById('acc-'+section);
  if(!btn||!content)return;
  var isOpen=content.classList.contains('show');
  if(isOpen){
    content.classList.remove('show');
    btn.classList.remove('active');
  } else {
    content.classList.add('show');
    btn.classList.add('active');
  }
}

// ===== INIT =====
window.onload=loadData;
</script>
